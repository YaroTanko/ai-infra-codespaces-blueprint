name: policy-checks

on:
  push:
    branches: [main, cursor/design-plan-implementation-41d8]
  pull_request:

jobs:
  validate-manifests-and-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=v5.5.0
          curl -fsSL -o /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Validate repository contracts and policy gates
        run: make validate
