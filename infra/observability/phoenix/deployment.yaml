apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: observability-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:8.0.0
          ports:
            - containerPort: 6006
            - containerPort: 4317
