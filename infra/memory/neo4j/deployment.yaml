apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: ai-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.22
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: NEO4J_AUTH
          ports:
            - containerPort: 7474
            - containerPort: 7687
