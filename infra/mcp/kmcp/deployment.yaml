apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmcp-default
  namespace: agents-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kmcp-default
  template:
    metadata:
      labels:
        app: kmcp-default
    spec:
      containers:
        - name: mcp
          image: ghcr.io/example/kmcp-server:latest
          ports:
            - containerPort: 8090
