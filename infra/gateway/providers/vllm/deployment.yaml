apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: ghcr.io/example/vllm:latest
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
