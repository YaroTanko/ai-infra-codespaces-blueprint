apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd
  namespace: gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmd
  template:
    metadata:
      labels:
        app: llmd
    spec:
      containers:
        - name: llmd
          image: ghcr.io/example/llmd:v0.1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
