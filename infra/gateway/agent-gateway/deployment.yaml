apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gateway
  namespace: gateway-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-gateway
  template:
    metadata:
      labels:
        app: agent-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/example/agent-gateway:v0.1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
