apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgateway-controller
  namespace: gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kgateway-controller
  template:
    metadata:
      labels:
        app: kgateway-controller
    spec:
      containers:
        - name: controller
          image: ghcr.io/example/kgateway-controller:latest
          ports:
            - containerPort: 9443
