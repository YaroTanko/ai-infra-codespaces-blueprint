apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpg
  namespace: security-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpg
  template:
    metadata:
      labels:
        app: mcpg
    spec:
      containers:
        - name: mcpg
          image: ghcr.io/example/mcpg:v0.1.0
          ports:
            - containerPort: 8081
